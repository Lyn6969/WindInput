name: CI

# push/PR 门禁:全程 ubuntu-latest 交叉编译校验(无需 Windows runner)。
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 mingw-w64 (x86_64 + i686，TSF 交叉编译用)
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wind_input

      # fmt --check + clippy(win-gnu target) + test(本机)
      - name: dev.sh ci
        run: ./scripts/dev.sh ci

      - name: 交叉编译 TSF DLL (x64 + x86)
        run: |
          make -C wind_tsf VERSION="${GITHUB_SHA::8}"
          make -C wind_tsf x86 VERSION="${GITHUB_SHA::8}"
