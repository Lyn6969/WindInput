name: CI

# push/PR 门禁:全程 ubuntu-latest 交叉编译校验(无需 Windows runner)。
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 统一 MSVC 工具链:clang-19(C++ TSF 需 clang≥19)+ lld-19 + llvm-19;
      # cargo-xwin 交叉编 Rust、clang 交叉编 C++ TSF,均经 MSVC SDK(无需 mingw)。
      - name: 安装 clang-19/lld-19/llvm-19
        run: sudo apt-get update && sudo apt-get install -y clang-19 lld-19 llvm-19

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: 安装 cargo-xwin
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-xwin

      # 缓存 MSVC CRT/Windows SDK(xwin 首次下载约数百 MB)
      - name: 缓存 xwin SDK
        uses: actions/cache@v4
        with:
          path: ~/.cache/cargo-xwin
          key: xwin-${{ runner.os }}-v1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wind_input

      # fmt --check + clippy(msvc target) + test(本机)
      - name: dev.sh ci
        run: ./scripts/dev.sh ci

      - name: 交叉编译 TSF DLL (x64 + x86)
        run: |
          V="$(tr -d '[:space:]' < docs/VERSION)"
          make -C wind_tsf VERSION="$V"
          make -C wind_tsf x86 VERSION="$V"

  # 门控: 仅当 macOS 相关路径改动时才触发 macOS 编译校验。
  # GitHub 不支持 per-job paths, 故用一个 ubuntu 廉价 job 输出是否命中, macos-check 据此 if 短路。
  changes:
    name: Detect macOS-related changes
    runs-on: ubuntu-latest
    outputs:
      macos: ${{ steps.filter.outputs.macos }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            macos:
              - 'wind_macos/**'
              - 'wind_input/**'
              - 'scripts/mac/**'

  # 轻量 macOS 编译校验: swift build + cargo check(darwin), 不打包 .app。
  macos-check:
    name: macOS Build Check
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wind_input

      - name: Build wind_macos (Swift IMKit)
        working-directory: wind_macos
        run: swift build

      - name: Check wind_input (Rust core, darwin)
        working-directory: wind_input
        run: cargo check --workspace
