name: Release

# 全 Linux 交叉编译 + 打包。两种触发:
#   - push tag v*    → 产出草稿 Release(附 Setup.exe + .sha256)
#   - workflow_dispatch → 产出可测 artifact(不发 Release),供合并前 Windows 实测
# 产物:WindInput-<版本>-Setup.exe(自解压安装程序,含 x64/x86 TSF + 词库)。
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}     # 手动触发:走完整打包,只产出可测 artifact,不发 Release

permissions:
  contents: write          # 创建 Release / 上传产物

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # 三个仓库需为同级目录:wind-installer 依赖 ../wind-ui-rust;
      # pack-installer.sh 用 ../wind-installer。均 checkout 到 $GITHUB_WORKSPACE 下。
      - name: 检出 WindInput
        uses: actions/checkout@v4
        with:
          path: WindInput
          fetch-depth: 0      # release notes 需完整历史
      - name: 检出 wind-installer
        uses: actions/checkout@v4
        with:
          repository: huanfeng/wind-installer
          path: wind-installer
          # 私有仓库需在仓库 Secrets 配置 PAT(repo 读权限);公开仓库可删此行。
          token: ${{ secrets.WIND_REPOS_TOKEN }}
      - name: 检出 wind-ui-rust (installer GUI 依赖)
        uses: actions/checkout@v4
        with:
          repository: huanfeng/wind-ui-rust
          path: wind-ui-rust
          token: ${{ secrets.WIND_REPOS_TOKEN }}

      # 统一 MSVC 工具链:clang-19(C++ TSF 需 clang≥19)+ lld-19 + llvm-19;
      # Rust 经 cargo-xwin、C++ TSF 经 clang,均走 MSVC SDK(无需 mingw)。
      - name: 安装 clang-19/lld-19/llvm-19
        run: sudo apt-get update && sudo apt-get install -y clang-19 lld-19 llvm-19

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: 安装 cargo-xwin
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-xwin

      - name: 缓存 xwin SDK
        uses: actions/cache@v4
        with:
          path: ~/.cache/cargo-xwin
          key: xwin-${{ runner.os }}-v1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            WindInput/wind_input
            wind-installer

      # tag 为发布版本的唯一真值源；docs/VERSION 仅为开发占位。把 tag 版本写入
      # docs/VERSION，让下游(build.rs 资源版本 / dev.sh dist / pack-installer)统一取到。
      - name: 确定版本并写入 docs/VERSION
        working-directory: WindInput
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"                                     # tag 为发布版本唯一真值源
          else
            V="$(tr -d '[:space:]' < docs/VERSION)-dev.${GITHUB_SHA::8}"  # 手动触发:开发占位版本
          fi
          echo "$V" > docs/VERSION
          echo "build version = $V"
          echo "BUILD_VERSION=$V" >> "$GITHUB_ENV"

      - name: 构建发布目录 (exe + x64/x86 TSF + data)
        working-directory: WindInput
        run: ./scripts/dev.sh dist

      - name: 打包安装程序 (cross stub + native packer，免 wine)
        working-directory: WindInput
        run: ./scripts/pack-installer.sh --version "$BUILD_VERSION" --compression zstd

      - name: 创建草稿 Release (仅 tag 触发)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          draft: true                          # 人工审核 Release Notes 后再发布
          generate_release_notes: true
          files: |
            wind-installer/dist/WindInput-*-Setup.exe
            wind-installer/dist/WindInput-*-Setup.exe.sha256

      - name: 上传安装器 artifact (手动触发,供 Windows 实测)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: WindInput-Setup-${{ github.sha }}
          path: |
            wind-installer/dist/WindInput-*-Setup.exe
            wind-installer/dist/WindInput-*-Setup.exe.sha256
          retention-days: 14
