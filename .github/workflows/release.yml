name: Release

# 全 Linux 交叉编译 + 打包。两种触发:
#   - push tag v*    → 产出草稿 Release(附 Setup.exe + .sha256)
#   - workflow_dispatch → 产出可测 artifact(不发 Release),供合并前 Windows 实测
# 产物:WindInput-Setup-<版本>.exe(自解压安装程序,含 x64/x86 TSF + 设置程序 + 便携启动器 + 词库)。
# 依赖私有仓(wind-installer/wind-setting)经 secrets.WIND_REPOS_TOKEN 检出,故本 workflow
# 只能在本仓库运行;fork 无 token 发版会失败,但 ci.yml 不碰私有仓,fork 的 CI 正常。
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}     # 手动触发:走完整打包,只产出可测 artifact,不发 Release

permissions:
  contents: write          # 创建 Release / 上传产物

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # 多仓库需为同级目录:wind-setting 依赖 ../wind-ui-rust 和 ../WindInput;
      # pack-installer.sh 用 ../wind-installer。均 checkout 到 $GITHUB_WORKSPACE 下。
      # 其中 wind-installer / wind-setting 为私有仓,必须经 WIND_REPOS_TOKEN 检出。
      - name: 检出 WindInput
        uses: actions/checkout@v4
        with:
          path: WindInput
          fetch-depth: 0      # release notes 需完整历史
      - name: 检出 wind-installer
        uses: actions/checkout@v4
        with:
          repository: huanfeng/wind-installer
          path: wind-installer
          # 私有仓库需在仓库 Secrets 配置 PAT(repo 读权限);公开仓库可删此行。
          token: ${{ secrets.WIND_REPOS_TOKEN }}
      - name: 检出 wind-ui-rust (installer GUI 依赖)
        uses: actions/checkout@v4
        with:
          repository: huanfeng/wind-ui-rust
          path: wind-ui-rust
          # 公开仓库,token 非必需;沿用同一 PAT 以统一速率限额。
          token: ${{ secrets.WIND_REPOS_TOKEN }}
      - name: 检出 wind-setting
        uses: actions/checkout@v4
        with:
          repository: huanfeng/wind-setting
          path: wind-setting
          # 私有仓库无权限时必须失败，避免发布包缺少设置程序。
          token: ${{ secrets.WIND_REPOS_TOKEN }}
      - name: 检出 wind-portable
        uses: actions/checkout@v4
        with:
          repository: huanfeng/wind-portable
          path: wind-portable
          # 私有仓库无权限时必须失败，避免发布包缺少便携启动器。
          token: ${{ secrets.WIND_REPOS_TOKEN }}

      # 统一 MSVC 工具链:clang-19(C++ TSF 需 clang≥19)+ lld-19 + llvm-19;
      # Rust 经 cargo-xwin、C++ TSF 经 clang,均走 MSVC SDK(无需 mingw)。
      - name: 安装 clang-19/lld-19/llvm-19
        run: sudo apt-get update && sudo apt-get install -y clang-19 lld-19 llvm-19

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: 安装 cargo-xwin
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-xwin

      - name: 缓存 xwin SDK
        uses: actions/cache@v4
        with:
          path: ~/.cache/cargo-xwin
          key: xwin-${{ runner.os }}-v1
          restore-keys: |
            xwin-${{ runner.os }}-

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            WindInput/wind_input
            wind-installer
            wind-ui-rust
            wind-setting
            wind-portable

      # tag 为发布版本的唯一真值源；docs/VERSION 仅为开发占位。把 tag 版本写入
      # docs/VERSION，让下游(build.rs 资源版本 / dev.sh release / pack-installer)统一取到。
      - name: 确定版本并写入 docs/VERSION
        working-directory: WindInput
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"                                     # tag 为发布版本唯一真值源
          else
            V="$(tr -d '[:space:]' < docs/VERSION)-dev.${GITHUB_SHA::8}"  # 手动触发:开发占位版本
          fi
          echo "$V" > docs/VERSION
          echo "build version = $V"
          echo "BUILD_VERSION=$V" >> "$GITHUB_ENV"

      - name: 构建发布产物
        working-directory: WindInput
        run: ./scripts/dev.sh release

      # 排在安装器之前：便携包只依赖上一步的 build/，不碰任何私有伴生仓，
      # 先出它可以在安装器打包出问题时仍拿到一份可用产物。
      # skip 复用已构建的 build/，不重复全构建。
      - name: 打包便携版压缩包
        working-directory: WindInput
        run: ./scripts/dev.sh portable-zip skip

      - name: 打包安装程序 (cross stub + native packer，免 wine)
        working-directory: WindInput
        env:
          WIND_REQUIRE_COMPANIONS: "1"
        run: ./scripts/pack-installer.sh --version "$BUILD_VERSION" --compression lzma

      # 本仓绝大多数改动直接提交、不走 PR，GitHub 的 generate_release_notes 只会
      # 产出一个空的 "What's Changed"，故改为自行按 conventional commits 汇总。
      # 模板与分类规则见 scripts/gen-release-notes.sh 与 docs/release-notes/。
      - name: 生成 Release Notes (仅 tag 触发)
        if: github.ref_type == 'tag'
        working-directory: WindInput
        run: ./scripts/gen-release-notes.sh --tag "$GITHUB_REF_NAME" -o release_notes.md

      - name: 创建草稿 Release (仅 tag 触发)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          draft: true                          # 人工审核 Release Notes 后再发布
          name: 清风输入法 v${{ env.BUILD_VERSION }}
          # 正文里的 user-facing 标记块是给人填的：发布前把面向用户的更新说明写进
          # 标记内。两个下游按此标记取内容 —— 文档仓 scripts/sync_release_notes.py
          # (→ 官网更新记录) 与 wind-setting src/update/notes.rs (→ 应用内升级提示)，
          # 保持"暂未填写"占位则两边都跳过。
          body_path: WindInput/release_notes.md
          files: |
            wind-installer/dist/WindInput-Setup-*.exe
            wind-installer/dist/WindInput-Setup-*.exe.sha256
            WindInput/dist/WindInput-Portable-*.zip
            WindInput/dist/WindInput-Portable-*.zip.sha256

      - name: 上传安装器 artifact (手动触发,供 Windows 实测)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: WindInput-Setup-${{ github.sha }}
          path: |
            wind-installer/dist/WindInput-Setup-*.exe
            wind-installer/dist/WindInput-Setup-*.exe.sha256
            WindInput/dist/WindInput-Portable-*.zip
            WindInput/dist/WindInput-Portable-*.zip.sha256
          retention-days: 14
