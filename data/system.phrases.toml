# WindInput 系统短语
# 随程序打包发布，用户不应直接修改此文件
# 文本中的 $变量 会在运行时自动展开（$var / ${var}，$$ 转义为 $）
#
# weight: 0~10000 短语 tier 内排序权重，未设置默认 1000（中位）
# position: 仅同 code 多条 tie-break（升序）
# platform: ""/"all"=全平台；"windows"/"darwin"/"linux"=仅该平台
# 详见 docs/design/command-bar-design.md

[[phrases]]
code = 'date'
text = '$Y年$M月$D日'
weight = 1000
position = 1

[[phrases]]
code = 'date'
text = '$Y-$MM-$DD'
weight = 800
position = 2

[[phrases]]
code = 'date'
text = '$Y.$MM.$DD'
weight = 800
position = 3

[[phrases]]
code = 'date'
text = '$Y/$MM/$DD'
weight = 800
position = 4

[[phrases]]
code = 'date'
text = '${YC}年${MC}月${DC}日'
weight = 800
position = 5

# 农历补两条，weight 低于全部公历形态故恒排其后。$LF 在非节日展开为空，
# 于是同一条模板平常日子给「农历四月廿九」、端午当天给「农历五月初五端午节」。
# 农历大全见 zznl。
[[phrases]]
code = 'date'
text = '农历$LMD$LF'
weight = 600
position = 6

[[phrases]]
code = 'date'
text = '$LY$LZ年$LMD$LF'
weight = 600
position = 7

