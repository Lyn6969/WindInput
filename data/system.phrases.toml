# 农历专用组。取的是**当天**的农历，与快捷输入 `;2026.6.19` 的农历候选同一套换算。
#
# $LF（传统节日）在非节日展开为空，故带它的条目平常日子只是少一段、照常出候选；
# 而 position 7 那条**只有** $LF，整条展开为空时会被丢弃——于是它只在春节、端午、
# 中秋这些日子自己冒出来，平时不占位。这是「条件性条目」的推荐写法。
[[phrases]]
code = 'zznl'
text = '农历$LMD$LF'
