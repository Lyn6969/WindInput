# 应用兼容性规则
# 针对特定应用的候选框定位、光标获取等兼容性修正。
# 用户可在 %APPDATA%\WindInput\compat.toml 中覆盖或添加规则。
#
# 可用字段:
#   process:              进程名（不区分大小写）
#   comment:              说明（仅文档用途）
#   caret_use_top:        使用 caret rect 的 top 而非 bottom 定位候选框
#                         适用于 GetTextExt 返回的 height 不稳定的 WebView 应用
#   first_show_mode:      候选框首显策略，三档互斥（默认 "fast"）：
#                         "fast"    默认。仍等坐标，但等到「可信」即放行。DLL 在首帧
#                                   reflow 期间连发几条试探坐标，取第一条「与上一轮权威
#                                   坐标不同」的采用——宿主未 reflow 时返回的正是上一轮
#                                   那个位置，一旦变化即说明新位置已就绪。连续快速输入时
#                                   更进一步：直接采信首条（连打不重排，跟手比精确更重要）。
#                                   焦点切换或鼠标移动光标之后，手里的坐标属于别处，此时
#                                   自动退回去等真坐标（首帧信任门），不会先错位再跳。
#                                   实测常规连打首帧中位 7ms，焦点后首帧中位 105ms。
#                         "wait"    等宿主 reflow 后的权威坐标才显示，代价是 85~95ms 首显
#                                   延迟，快速连打时候选框只来得及显示几毫秒。留给
#                                   "fast" 判据失灵的宿主兜底。
#                         "instant" 完全不等，首帧沿用上一次的坐标。最快，但只要光标位置
#                                   变动过（手动移动、换行、重排）那个位置就是错的。
#   initial_mode:         进入本应用时的初始中英状态："english" | "chinese"｜不写=跟随全局。
#                         典型用途：搜索框/终端类应用默认英文（如 Everything.exe）。
#   initial_punct:        进入本应用时的初始中英标点，取值同上；不写=跟随全局。
#                         显式值优先于 config.toml 的 input.punct.follow_mode 推导。
#   host_render:          加入 HostRender 白名单（默认 false）。用于候选窗无法盖过宿主
#                         Band 层级的受限宿主（如 Win11 开始菜单 SearchHost.exe）：候选窗
#                         改由服务进程渲染后经共享内存转交宿主进程内的 DLL 上屏。
#                         普通应用不要开启——多一层渲染路径，出问题时本地窗口路径更好排查。
#
# 上述三项对应右键菜单：「应用独立配置（<进程名>）」子菜单，各自单选。
# （菜单切换会写入用户层 compat.toml，不改本文件）
#
# ⚠ initial_mode / initial_punct 的语义是「初始值」而不是「锁定」：
#   - 每次焦点**从别的应用**切进来时套用一次；停留在本应用期间用户可自由手动切换，
#     同一应用内换输入框（如搜索框↔结果列表）不会重新套用。
#   - 焦点**离开**规则应用时，下一个应用会重新按全局规则决定自己的状态。在出厂默认
#     （input.default.state_scope = "global" 且 remember_last_state = false）下，这意味着
#     它回到 input.default.chinese_mode 这个配置默认值，而不是它自己上次的状态。
#     若希望每个应用各自精确记住上次状态，请另行设置 input.default.state_scope = "app"，
#     两者可叠加（规则决定初始值，记忆负责其余应用）。
#   - 没有配置任何 initial_* 规则的两个应用之间切换，状态一律不动，不受本功能影响。
#
# 与首显相关的三个内部选项在 config.toml 的 [ui.candidate] 下（不进设置页）：
#   first_show_settle_ratio      首显用过非权威坐标时，权威坐标与它相差在「行高 × 本值」以内
#                                就不再校正（默认 0.8）。校正动作本身才是抖动的观感来源。
#   fast_typing_window_ms        两次按键间隔小于此值即视为连续输入，fast 档直接采信首条
#                                试探坐标（默认 100）。0 = 关闭该快路径。
#   fast_first_show_fallback_ms  fast 档等不到坐标时的兜底超时（默认 25）。不发
#                                OnLayoutChange 的宿主（如 Word）靠它退化成 instant 而非干等。

[[apps]]
process = "Weixin.exe"
comment = "微信 - Qt WebView 输入框 caret height 不稳定（h=1 或 h=20），使用 rect.top 定位"
caret_use_top = true

[[apps]]
process = "SearchHost.exe"
comment = "Win11 开始菜单 / 任务栏搜索，候选窗无法盖过其 Band 层级，走 HostRender 代理渲染"
host_render = true

