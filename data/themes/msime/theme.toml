# v3-C schema: base 单链继承唯一基础主题 _base。msime 仅微调主色（微软蓝）+ 紧凑几何 + 文本序号 + 强调条。
# 其余颜色（border/selection/text/toolbar 等）继承 _base 清风蓝色系。
# 注意：顶层标量键 base 必须在任何 [table] 之前。
base = "_base"

[meta]
name = "微软风格"
version = "3.0"
author = "清风输入法"
order = 1

[behavior]
always_show_pager = false
show_page_number = true

[colors]
primary = "#0078D4"   # 微软蓝（base 其余清风蓝色继承）

[item]
padding = [6, 8]   # msime 紧凑

[index]
color = "#888888"   # 灰色文本序号
font_size = 2

[comment]
font_size = -2

[footer_bar]
font_size = -2

[accent_bar]
enabled = true   # msime 选中强调条
width = 3
