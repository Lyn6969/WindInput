# 唯一基础主题（_ 前缀目录 → 不显示在主题列表，仅供 default/msime/jidian 等通过 base 继承）。
# 配方：颜色=清风蓝；toolbar=跟随语义（${accent}/${surface}/${text_dim}）；候选窗几何基线
# （item padding 保证合理行高）；序号=纯数字无圆圈（default 可 override 圆圈）。
#
# TOML 主题为「扁平人写形态」：视图节点直接顶层成表（[window]/[item]/…），radius/shape 上提到
# 节点级，padding/margin 支持标量/数组简写，引擎加载时归一化为内存模型（见 wind-theme/normalize.rs）。
# 视图节点白名单：window candidate_list preedit_bar item index text comment
#                 accent_bar footer_bar mode_label status tooltip toast toolbar menu

[meta]
name = "基础主题(清风蓝·跟随语义)"
version = "1.0"

[colors]
primary = "#4285F4"
# 颜色派生固化：引擎只读最终色、不重算。derive 块仅供编辑器记录算法，引擎忽略。
derive = { enabled = true, algorithm = "hsl-shift" }

bg = { light = "#FFFFFF", dark = "#2D2D2D" }
surface = { light = "#F0F0F0", dark = "#3A3A3A" }
border = { light = "#C8C8C8", dark = "#404040" }
text = { light = "#1E1E1E", dark = "#E0E0E0" }
text_dim = { light = "#646464", dark = "#B0B0B0" }
text_hint = { light = "#969696", dark = "#808080" }
accent = "${primary}"
on_accent = "#FFFFFF"
shadow = { light = "#0000000F", dark = "#0000001A" }

selection = { light = "#E6F0FF", dark = "#3D4A5C" }
selection_text = "${text}"
hover = "${selection}"

menu_bg = "${bg}"
menu_border = { light = "#C7C7C7", dark = "${border}" }
menu_text = "${text}"
menu_disabled = { light = "#A1A1A1", dark = "#707070" }
menu_hover_bg = "${accent}"
menu_hover_text = "${on_accent}"
menu_separator = { light = "#DBDBDB", dark = "${border}" }

tooltip_bg = { light = "#3C3C3CF0", dark = "#1E1E1EF0" }
tooltip_text = { light = "#FFFFFF", dark = "${text}" }
status_bg = { light = "#323232E6", dark = "#1E1E1EE6" }
status_text = { light = "#FFFFFF", dark = "${text}" }
status_border = "${accent}"
toast_bg = { light = "#323232E6", dark = "#1E1E1EE6" }
toast_text = { light = "#FFFFFF", dark = "${text}" }

toolbar_background = "${bg}"
toolbar_border = { light = "#E0E0E0", dark = "${border}" }
toolbar_grip = { light = "#C0C0C0B3", dark = "#5A5A5AB3" }
toolbar_mode_chinese_bg = "${accent}"
toolbar_mode_english_bg = { light = "#8A8A8A", dark = "#5A5A5A" }
toolbar_mode_text = "${on_accent}"
toolbar_full_width_off_bg = { light = "${surface}", dark = "${border}" }
toolbar_full_width_off_text = "${text_dim}"
toolbar_punct_english_bg = { light = "${surface}", dark = "${border}" }
toolbar_punct_english_text = "${text_dim}"
toolbar_settings_bg = { light = "${surface}", dark = "${border}" }
toolbar_settings_icon = { light = "${text_dim}", dark = "#9B8CCE" }
toolbar_settings_hole = { light = "${surface}", dark = "${border}" }

[window]
padding = [6, 8]
radius = 8
border = { width = "1px", color = "${border}" }
background = "${bg}"
shadow = { offset = [2, 2], color = "${shadow}" }

[preedit_bar]
padding = [3, 8]
background = "${surface}"
color = "${text_dim}"

[item]
padding = [7, 10, 7, 8]
radius = 4

[item.selected]
background = "${selection}"
color = "${selection_text}"

[item.hover]
background = "${hover}"

[index]
color = "${accent}"
shape = "none"
font_size = -2
padding = { left = 3, right = 3 }

[text]
margin = { left = 4 }
color = "${text}"

[comment]
margin = { left = 6 }
color = "${text_hint}"
font_size = -4

[footer_bar]
font_size = -4
margin = { left = 8 }
prev_image = { ref = "chevron_prev.svg", mode = "center", tint = "${accent}", disabled_tint = "${text_hint}" }
next_image = { ref = "chevron_next.svg", mode = "center", tint = "${accent}", disabled_tint = "${text_hint}" }

[accent_bar]
background = "${accent}"

[status]
background = "${status_bg}"
color = "${status_text}"

[tooltip]
background = "${tooltip_bg}"
color = "${tooltip_text}"

[toast]
background = "${toast_bg}"
color = "${toast_text}"

[toolbar]
background = "${toolbar_background}"
border = { color = "${toolbar_border}" }
# 几何（dp）：整条高、拖动柄宽、每格宽、激活/悬停格高亮内缩。
# button_radius 未列→引擎按「格内高×0.3」派生（随高自适应）；如需固定圆角可显式配置。
height = 30
grip_width = 12
button_width = 30
button_padding = 4

[toolbar.grip]
color = "${toolbar_grip}"

[toolbar.button]
background = "${toolbar_full_width_off_bg}"
color = "${toolbar_full_width_off_text}"

[toolbar.button.chinese]
background = "${toolbar_mode_chinese_bg}"

[toolbar.button.english]
background = "${toolbar_mode_english_bg}"

[toolbar.settings]
icon = "${toolbar_settings_icon}"
hole = "${toolbar_settings_hole}"

[menu.root]
radius = 6
background = "${menu_bg}"
border = { width = 1, color = "${menu_border}" }

[menu.item]
color = "${menu_text}"

[menu.item.hover]
background = "${menu_hover_bg}"
color = "${menu_hover_text}"

[menu.item.disabled]
color = "${menu_disabled}"

[menu.separator]
background = "${menu_separator}"
