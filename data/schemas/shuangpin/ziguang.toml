[meta]
id = "ziguang"
name = "紫光双拼"

[initials]
u = "zh"
i = "sh"
a = "ch"

[finals]
a = ["a"]
o = ["uo", "o"]
e = ["e"]
i = ["i"]
u = ["u"]
# ü 单独成韵（绿 lv / 女 nv）。原先 finals 缺这一行，而 `n = [..., "ve"]` 里
# 的复合韵母又在，于是「略/虐」打得出、「绿/女」打不出。
v = ["v"]
b = ["iao"]
d = ["ie"]
f = ["ian"]
g = ["iang", "uang"]
h = ["iong", "ong"]
j = ["er", "iu"]
k = ["ei"]
l = ["uan"]
";" = ["ing"]
m = ["un"]
n = ["ue", "ui", "ve"]
p = ["ai"]
q = ["ao"]
r = ["an"]
s = ["ang"]
t = ["eng"]
w = ["en"]
x = ["ia", "ua"]
y = ["in", "uai"]
z = ["ou"]

# 零声母双引导：e 系列以 `e` 引导，其余以 `o` 引导，第二键均取该音节自身的韵母键。
#   ee=e  ek=ei  ew=en  et=eng  ej=er
#   oa=a  op=ai  or=an  os=ang  oq=ao  oo=o  oz=ou
# `o` 那行原先只列了 o/ou，于是「爱/安/昂/袄」在紫光下打不出（与 abc.toml 同款欠账）。
# 补 a 系列不遮蔽任何合法音节：`o` 不是合法声母，`oa`/`op`… 走常规路径本就拼不出音节。
# ⚠️ 反过来**不能**改用 `a` 引导（那才是「首字母引导」的字面推论）——紫光把 `a` 键给了
# ch 声母，`aa`/`as`/`aq` 一旦被零声母抢走，「茶/常/朝」这些常用字就打不出来了。
[zero_initials]
o = ["a", "ai", "an", "ang", "ao", "o", "ou"]
e = ["e", "ei", "en", "eng", "er"]
