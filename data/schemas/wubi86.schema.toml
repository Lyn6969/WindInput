[schema]
id = "wubi86"
name = "五笔"
icon_label = "五"
version = "1.0"
author = "内置"
description = "五笔86版输入方案"

[engine]
type = "codetable"

[engine.chaizi]
db_path = "wubi86/wubi86_chaizi.txt"
font_path = "wubi86/HeiTiZiGen.ttf"
font_family = "黑体字根"

# 引擎固定参数；行为/调频/造词/临时拼音等用户可配项已上移至全局 [schema.codetable]
# 与 schema_overrides（见 docs/redesign/schema-config-layering.md）。
#
# 内置方案在这一段里**不留任何用户可配项的例外**——方案级的值恒覆盖全局，写在这里
# 就等于把全局页那一项对本方案变成摆设，而用户不知情。第三方方案作者写是正当的
# （用户装那张码表时就接受了作者的安排），内置方案没有这个「用户选择安装」的动作。
[engine.codetable]
max_code_length = 4
base_sort = "weight"
# ⛔ 刻意**不**声明 short_code_yield_level（出简让全），别「顺手补回来」。
#
# 0.119 曾在这里写过 3（极点五笔确实是标准的前缀式简码体系，kht 就是「路」的三简），
# 当天撤回：方案级的值恒覆盖全局，于是用户在全局页调这一项时五笔纹丝不动，而他多半
# 没留意方案级码表配置里那一行标着「方案自带」——出厂就跟用户对着干的默认值，
# 代价大于这个功能本身。
#
# 现在五笔与其它码表方案一样跟随全局出厂 0（关），要用的人自己在设置里开。
# 词库侧同样不代做：gen_dict 的 [demotion] 已退役，发行词库保留极点上游的候选次序。

[[dictionaries]]
id = "wubi86_main"
label = "极点五笔主词库"
description = "极点五笔基础词库，含单字与高频词组"
path = "wubi86/wubi86_jidian.dict.yaml"
type = "rime_codetable"
default = true
base_order = 0

[[dictionaries]]
id = "wubi86_extra"
label = "扩展词库"
description = "新词、网络用语、生僻词等非常用词条"
path = "wubi86/wubi86_jidian_extra.dict.yaml"
type = "rime_codetable"
default_enabled = true
# 本库有真实词频权重（1843 条 / 643 个不同值，中位 950、max 2125，与主库同量纲），
# 故不设 default_weight——抹平会丢失词频信息。base_order=1 保证等权时排在主库之后。
base_order = 1

[[dictionaries]]
id = "wubi86_emoji"
label = "Emoji 表情"
description = "按五笔编码检索 emoji；输入 emoj 可查看常用表情"
path = "wubi86/wubi86_jidian_emoji.dict.yaml"
type = "rime_codetable"
default_enabled = true
# 切勿设 default_weight：本库 71 条常用表情共用编码 `emoj`，靠 200/199/198… 递减权重表达
# 展示顺序（😂>🤣>😊…），抹平权重会把这套顺序毁成文件序。其余 199 条恒 100，天然等权。
# base_sort=weight 下同码内按权重降序，该顺序已自动生效，无需额外配置。
base_order = 2

[[dictionaries]]
id = "wubi86_xzqy"
label = "行政区域"
description = "省市县区等地名词条"
path = "wubi86/wubi86_jidian_extra_district.dict.yaml"
type = "rime_codetable"
default_enabled = false
base_order = 3
# 本库无 weight 列（列为 text/code/空/行政区划码），解析后权重恒 0。不配 default_weight 时
# 会因 weight=0 在权重模式下整体沉底——此前"看起来正常"只是全库同为 0 而退化成文件序的巧合。
# 显式定档 500：低于主库中位 941（地名不压常用字），远高于 0（启用后可见而非沉底）。
# 整库同权 ⟹ 库内自动按 natural_order（文件顺序）排列，即该库 yaml 里 `sort: original` 的本意。
default_weight = 500

[encoder]
max_word_length = 10

[[encoder.rules]]
length_equal = 2
formula = "AaAbBaBb"

[[encoder.rules]]
length_equal = 3
formula = "AaBaCaCb"

[[encoder.rules]]
length_in_range = [4, 10]
formula = "AaBaCaZa"
