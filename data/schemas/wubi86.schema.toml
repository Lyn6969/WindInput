[schema]
id = "wubi86"
name = "五笔"
icon_label = "五"
version = "1.0"
author = "内置"
description = "五笔86版输入方案"

[engine]
type = "codetable"

[engine.chaizi]
db_path = "wubi86/wubi86_chaizi.txt"
font_path = "wubi86/HeiTiZiGen.ttf"
font_family = "黑体字根"

# 仅引擎固定参数；行为/调频/造词/临时拼音等用户可配项已上移至全局 [schema.codetable]
# 与 schema_overrides（见 docs/redesign/schema-config-layering.md）。
[engine.codetable]
max_code_length = 4
base_sort = "weight"

[[dictionaries]]
id = "wubi86_main"
label = "极点五笔主词库"
description = "极点五笔基础词库，含单字与高频词组"
path = "wubi86/wubi86_jidian.dict.yaml"
type = "rime_codetable"
default = true

[[dictionaries]]
id = "wubi86_extra"
label = "扩展词库"
description = "新词、网络用语、生僻词等非常用词条"
path = "wubi86/wubi86_jidian_extra.dict.yaml"
type = "rime_codetable"
default_enabled = true
weight_as_order = true

[[dictionaries]]
id = "wubi86_emoji"
label = "Emoji 表情"
description = "按五笔编码检索 emoji；输入 emoj 可查看常用表情"
path = "wubi86/wubi86_jidian_emoji.dict.yaml"
type = "rime_codetable"
default_enabled = true
weight_as_order = true

[[dictionaries]]
id = "wubi86_xzqy"
label = "行政区域"
description = "省市县区等地名词条"
path = "wubi86/wubi86_jidian_extra_district.dict.yaml"
type = "rime_codetable"
default_enabled = false
weight_as_order = true

[encoder]
max_word_length = 10

[[encoder.rules]]
length_equal = 2
formula = "AaAbBaBb"

[[encoder.rules]]
length_equal = 3
formula = "AaBaCaCb"

[[encoder.rules]]
length_in_range = [4, 10]
formula = "AaBaCaZa"
