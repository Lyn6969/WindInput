# WindInput 系统预置配置（键名 6 域重命名后，见 docs/config-key-migration.md）
# 此文件为应用内置默认配置，随程序安装包分发。
# 加载优先级：代码默认值（Layer 1）→ 本文件（Layer 2）→ 用户配置
# （%APPDATA%\WindInput\config.toml，Layer 3）。
# 修改此文件可调整新安装或新版本升级后的默认行为，无需重新编译。
#
# ── 本文件的契约 ────────────────────────────────────────────────────────────
# 1. **完整**：`config_schema.rs` 的 REGISTRY 里每一个键都必须在此显式列出，
#    使本文件同时是「出厂默认值」与「全部可配置项的说明书」。
#    仅两个实例集合键刻意不写（见下方 [schema] 段说明），已在测试中登记豁免。
#    守护测试：`data_config_toml_covers_registry`（缺键即失败）、
#    `data_config_toml_has_no_orphan_keys`（多键即失败）。
# 2. **新增配置项需四处同步**：`config.rs` 结构体字段 + `Default` 初值 →
#    `config_schema.rs` 的 REGISTRY → 本文件。漏掉本文件时上面第一个测试会失败。
# 3. **数组是整体覆盖，不是合并**：本文件写出的数组会**整体替换**代码默认值，
#    而非并集。故此处漏写一个元素 = 该元素在成品里不存在。改数组类键前请先比对
#    `config.rs` 的 `default_*()` 函数。
#
# 注意：本文件不写 version 键——version 是用户文件的迁移状态锚点。

[schema]
active = "wubi86"
available = ["wubi86", "wubi86_pinyin"]
# 主码表方案 ID（拼音反查码源），留空时按 available 顺序自动选第一个码表方案
primary_codetable = ""
# 主拼音方案 ID（临时拼音的目标方案，如双拼方案 id），留空 = 全拼 "pinyin"
primary_pinyin = ""

# ── 刻意不在本文件出现的两个键（实例集合，注册表类型 StructList）────────────
# schema.special_modes  特殊模式列表（引导键 + 引用方案 id；代码默认 = 空数组）
# schema.mix_modes      临时融合模式列表（代码默认 = 内置「快捷」quick_mix，
#                       `;` 触发，成员 quick_input / $primary_pinyin / english）
#
# 二者是**结构体数组**，本文件一旦写出就会整体替换代码默认值，把当时的定义**冻结**
# 成快照——日后在 `default_mix_modes()` 里给内置「快捷」加成员或改触发键，全部会被
# 这份陈旧快照静默遮蔽（用户配置层已因设置页整表写回踩过同一个坑，见
# `Config::migrate_quick_mix_pinyin_member`）。故真相源留在代码侧，本文件不写。
# 二者已在 `data_config_toml_covers_registry` 的豁免名单中登记。

# 全局码表配置：所有码表方案公共基线（出厂取主力码表 wubi86 偏好）。
# 方案个性覆盖：在方案 .schema.toml 的 [engine.codetable] 内联行为字段（作者基线），或
# %APPDATA%/WindInput/schema_overrides/{id}.toml 同名的 [engine.codetable] 段（设置页写入，深合并覆盖）；
# 二者段名/字段与本节一致，字段存在即覆盖、缺省即回落本节。
[schema.codetable]
top_code_commit = true
clear_on_empty_max = false
auto_commit_at_full = false
# 自动上屏的最短码长（0 = 等于该方案全码长）。隐藏参数，设置页不暴露。
auto_commit_min_len = 0
punct_commit = true
show_code_hint = true
single_code_input = false
single_code_complete = true
z_key_repeat = true

# 码表调频（全局唯一；strategy: top=一次到顶 MRU / step=逐次提升）。
[schema.codetable.frequency]
enabled = false
protect_top_n = 1
strategy = "top"

# 码表自动造词（连续单字）：连续单字上屏累积成序列，遇终止符（标点/回车/空格/焦点切换/
# 光标移动/多字词上屏）或空闲超时后，按方案 [[encoder.rules]] 为整串算词组编码写入**临时
# 词库**（立即可选），累计用满 promote_count 次才晋升进用户词库。
[schema.codetable.auto_phrase]
enabled = false
# 造词最小字数。内部字段，设置页不暴露。
min_phrase_len = 2
# 造词最大字数。**超长序列整体放弃**，不截末尾 N 字——在连续多字中间切一刀，切出来的
# 多半不是词，是杂词的主要来源。内部字段，设置页不暴露。
max_phrase_len = 5
# 临时词晋升进用户词库所需的使用次数。0 = 不晋升，一直留在临时词库。
promote_count = 0
# 连续单字之间的最大间隔（毫秒，0 = 用内置 5000）。超时则视作序列终止。
# 兜底用：终止信号全漏时防止跨句拼出「加好加好」这类杂词。内部字段，设置页不暴露。
idle_timeout_ms = 0
# 临时词库条目上限（0 = 不限）。超出后淘汰权重最低者。内部字段，设置页不暴露。
temp_max_entries = 5000

# 全局拼音配置：所有拼音类方案（全拼/双拼/混输拼音子方案/临时拼音反查）共用一份。
[schema.pinyin]
show_code_hint = true
use_smart_compose = true
separator = "auto"

# 模糊音：enabled 是总开关，下面每项各自控制一组等价音（默认全关，逐项按需开启）。
[schema.pinyin.fuzzy]
enabled = false
# 声母组
zh_z = false
ch_c = false
sh_s = false
n_l = false
f_h = false
r_l = false
# 韵母组（前后鼻音）
an_ang = false
en_eng = false
in_ing = false
ian_iang = false
uan_uang = false

# 拼音调频（衰减参数；三个数值 0 = 用词频 store 的内置默认）。
[schema.pinyin.frequency]
enabled = true
# 半衰期（小时）：词频热度衰减到一半所需时间。
half_life = 0.0
# base 系数：静态基础词频在总分中的权重。
base_scale = 0.0
# 最近使用峰值：一次刚使用过的词能获得的最高加成。
recency_peak = 0.0

# 拼音自动造词。
[schema.pinyin.auto_learn]
enabled = true
# 造词最小字数（0 = 用内置 2）。
min_word_length = 0
# 临时词晋升进用户词库所需的使用次数（0 = 用内置默认）。
promote_count = 0

# 全局混输配置（融合策略；全局唯一，无方案级 override）。
[schema.mix]
show_source_hint = false
enable_english = false
pinyin_only_overflow = true
top_code_override_pinyin = false
# 满码自动上屏**与顶码上屏**遇拼音候选则否决（粗粒度：整串只要查得出拼音候选就让路拼音，
# 不看拼音成不成词）。与下方细粒度的 block_commit_on_pinyin_word 叠加，任一命中即否决。
# 注意它同时管顶码上屏，而 schema.codetable.top_code_commit 出厂即开；
# top_code_override_pinyin 可无视本否决强制倒向码表。
auto_commit_block_on_pinyin = true
# 满码上屏遇英文候选则否决（保护正在输入英文词的用户；仅 enable_english 开时有意义）。
auto_commit_block_on_english = false
min_pinyin_length = 2
# 英文最小触发长度（2 字符以内不查英文；0=回退 3）。
min_english_length = 3
# 拼音歧义拦截（词强度）：整串是强拼音词时否决五笔自动/顶码上屏，让拼音赢
# （wangba→网吧 拦；aipu→落实 无强词放行）。独立于 auto_commit_block_on_pinyin。
block_commit_on_pinyin_word = true
# 词强度权重阈值（0=仅结构判据：拼音首选须≥2汉字且消费整串；预留真机调）。
pinyin_word_min_weight = 0
# 混输时拼音是否产出简拼候选（声母缩写，nh→你好）。关闭后混输的拼音只认全拼，
# 适合「只把拼音当临时输入补位」的用户——简拼会让几乎任何字母串都可能是拼音。
# 仅影响混输的拼音子引擎，纯拼音方案不受影响。
enable_pinyin_abbrev = true

[schema.quick_input]
# 注：; 由内置 mix「快捷」融合接管（quick_input 作为其成员，同时支持日期/计算/拼音/英文）。
enabled = true
force_vertical = true
decimal_places = 6
# 快捷（融合）模式混入英文候选（低优先级排在拼音后）；独立于 schema.mix.enable_english。
enable_english = true

[input]
filter_mode = "smart"
enter_behavior = "commit"
space_on_empty_behavior = "commit"
numpad_behavior = "direct"
# 顶码上屏时「已确认文字」如何落到宿主（内部/实验项，设置页不暴露）：
#   direct_commit（默认）= 顶码时真提交，余码的新组合延到触发键 keyup 才开，靠隔一拍
#                          消息泵躲开 diff 合并；无下划线歧义、WPS 智能标点顶屏不清空。
#   pre_confirm         = 留在 TSF 组合态聚合，延到最终 CommitText 才真提交；diff 式宿主
#                          （终端 / Chromium）不双写，但部分宿主会给整段画下划线。
top_commit_mode = "direct_commit"

# 启动默认状态（原 [general] 域）
[input.default]
remember_last_state = false
chinese_mode = true
full_width = false
chinese_punct = true
# 中英状态作用域："global"=所有应用共享（默认）；"app"=每个应用各自记忆中英文（会话级）
state_scope = "global"

# 标点：随中英、数字后智能英文标点、自定义映射
[input.punct]
follow_mode = false
smart_after_digit = true
smart_list = ".,:"
# custom_enabled 为自定义标点映射总开关；custom_mappings 留空时全部走内置默认转换
custom_enabled = false
# 自定义标点映射表：key = 源字符（引号用 "1/"2/'1/'2 区分左右），
# value = [中文半角, 英文全角, 中文全角, 英文半角]（空串或缺列 = 该状态回退默认转换）。
# 例：custom_mappings = { "." = ["。", "．", "。", "."] }
custom_mappings = {}

# 智能符号：同一中文标点在时限内连按两次，删前一字符替换为英文
[input.symbol]
smart_mode = false
smart_timeout_ms = 500
smart_chars = "。，？！：；、～￥·……——"
# 替换方案（「体感」与「兼容性」的取舍，故两者都保留）：
#   delete_replace（默认）= 首次按键直接上屏中文符号，再按一次删掉重打成英文。所见即所得、
#                           无预览态中间状态，实际体感更好；代价是依赖对宿主做删改。
#   hold_composition      = 首次按键开 TSF 组合态预览中文符号，再按一次替换组合提交英文；
#                           超时后自动提交中文。全程不做删改，**兼容性更好**，适合在
#                           delete_replace 下表现异常的宿主。
smart_method = "delete_replace"

[input.temp_english]
enabled = true
show_candidates = true
shift_behavior = "temp_english"
trigger_keys = []
allow_symbols = false
space_as_input = false

[input.capslock]
cancel_on_mode_switch = false

[input.temp_pinyin]
enabled = true
trigger_keys = ["backtick"]
# 直达热键（如 "ctrl+shift+p"；空串 = 不注册）。与 trigger_keys 引导键共存，
# 用热键进入时组合区不写引导符。
hotkey = ""

[input.auto_pair]
chinese = false
english = false
chinese_pairs = ["（）", "【】", "｛｝", "《》", "〈〉"]
english_pairs = ["()", "[]", "{}", "<>"]
# 跳出配对的按键，可多选。"right_symbol" = 右符号键本身（打 ） 跳出已插入的 （）），
# 其余为键名 tab / enter / space / escape。列表里没有就是没有，不做隐式补偿。
# 引号等对称配对永不参与右符号跳出（按键不带「开/闭」信息），只能靠 tab / enter 跳出。
jump_out_keys = ["right_symbol"]

# URL 临时输入模式：正常输入下打出完整前缀（如 http / www.）即进入网址输入模式，
# 模式内自由输入网址字符（不触发上屏），空格或回车上屏。默认关闭。
[input.url]
enabled = false
prefixes = ["www.", "http", "https", "ftp."]

[input.s2t]
enabled = false
variant = "s2t"

[input.cmdbar]
enabled = false
candidate_prefix = "⚡"

# 短语前缀列举（原 [dict.phrase]）
[input.phrase]
min_prefix = 2

[keys]
toggle_mode_keys = ["lshift", "rshift"]
commit_on_switch = true
switch_engine = "ctrl+shift+e"
toggle_full_width = "shift+space"
toggle_punct = "ctrl+."
delete_candidate = "ctrl+shift+number"
pin_candidate = "ctrl+number"
toggle_toolbar = 'ctrl+shift+\'
open_settings = "ctrl+shift+]"
add_word = "ctrl+equal"
open_add_word_dialog = "ctrl+shift+equal"
toggle_s2t = "ctrl+shift+j"
activate_ime = "ctrl+shift+["
take_screenshot = "ctrl+shift+f11"
# 改用系统级 RegisterHotKey 抢占的**动作名**列表（不是键串）：列进来的动作会绕开宿主
# 自身的同名快捷键。仅支持无需按键上下文的 7 个动作：
#   switch_engine / toggle_full_width / toggle_punct / toggle_toolbar /
#   open_settings / take_screenshot / toggle_s2t
# 写入其它名字只会进 warn 日志并被忽略。activate_ime 不在此列（走系统
# DirectSwitchHotkeys 注册表，不经 RegisterHotKey）。空 = 全部走普通键盘钩子。
global_hotkeys = []
select_key_groups = ["semicolon_quote"]
page_keys = ["pageupdown", "minus_equal"]
highlight_keys = ["arrows", "tab"]
# 以词定字：用成对标点键从当前高亮候选词中逐字上屏（第1键取第1字、第2键取第2字）。
# 可选键组 comma_period(,/.) / minus_equal(-/=) / brackets([/])；空数组=禁用。
# 词长不足时按 [keys.overflow].select_char_key 策略处理。
select_char_keys = []

# 无效按键策略（候选不足以命中目标位次时）：ignore=吞键 / commit=上屏高亮候选 /
# commit_and_input=上屏高亮候选并追加该键字符。number_key=数字键、select_key=次/三选键、
# select_char_key=以词定字键。
[keys.overflow]
number_key = "ignore"
select_key = "ignore"
select_char_key = "ignore"

[ui.candidate]
font_size = 18
font_size_follow_theme = true
per_page = 7
per_page_extended = 0
max_chars = 16
layout = "horizontal"
# 编码显示方式：app_inline=内嵌应用光标处(候选窗不显 preedit) | candidate_top=候选窗顶部独立栏 | candidate_inline=编码内联候选首单元
preedit_display = "app_inline"
# 候选窗上翻到光标上方时的两个正交行为开关（可单独或叠加）：
flip_when_above = false          # 反转候选项排列顺序
swap_preedit_when_above = false  # 交换编码栏与候选栏位置（编码沉底贴光标）
# 完全不显示候选窗（与上翻无关的独立开关；盲打用）。
hide_window = false
index_labels = ""
pager_bar_display = ""
page_number_display = ""
pager_in_preedit = false         # 翻页栏并入编码栏行右对齐（竖排省一行；仅 candidate_top 生效）
# 定位方式：follow_caret=跟随光标（默认） | fixed=固定屏幕位置（不再随光标移动，也不再上翻）
position_mode = "follow_caret"
# 固定模式下的内容左上屏幕坐标，由拖动候选窗落盘；(0,0)=尚未设定，首显落到屏幕默认锚点。
custom_x = 0
custom_y = 0

[ui.font]
family = ""
path = ""
render_mode = "directwrite"

[ui.theme]
name = "default"
style = "system"

[ui.mode_indicator]
# 进入临时拼音/双拼/快捷/英文/快符等模式时的标识：short=短称(拼/双/快/英/符) | full=全称(临时拼音…) | none=不显示
style = "short"

[ui.status]
enabled = true
duration = 800
display_mode = "temp"
schema_name_style = "full"
position_mode = "follow_caret"
offset_x = 0
offset_y = 0
custom_x = 0
custom_y = 0
# 气泡显示哪些内容段；留空 = 全部显示。可选：schema/punct/full_width/s2t/caps
items = ["schema", "punct", "full_width", "s2t", "caps"]

# 悬停提示：原 ui.tooltip.{code,pinyin,chaizi,debug}.* 子表已拍平为平铺字段
[ui.tooltip]
delay = 200
code_enabled = true
pinyin_enabled = true
pinyin_heteronyms = true
pinyin_max_readings = 0
chaizi_enabled = false
debug_enabled = false

[ui.toolbar]
visible = true
hide_in_fullscreen = true
# 自动隐藏：显示后 auto_hide_delay 秒无交互则 1 秒淡出（悬停/拖动顺延；默认关）
auto_hide = false
auto_hide_delay = 5

[stats]
enabled = true
track_english = true

[compat]
host_render_processes = ["SearchHost.exe"]

[debug]
# trace / debug / info / warn / error。注意 info 及以下级别不得含用户输入内容与候选词。
log_level = "info"
# 单个日志文件大小上限（MB），超出即滚动。
log_max_size_mb = 10
# 保留的旧日志文件数上限（不含主文件）。服务每次启动都会滚动一次，
# 故该值约等于「能回溯最近几次运行」。
log_max_files = 10
