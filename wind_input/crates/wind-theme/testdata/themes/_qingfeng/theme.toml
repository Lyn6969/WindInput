# 清风设计基础主题（_ 前缀目录 → 不在主题列表显示，仅供「清风·XX」系列继承）。
# 继承 _base（沿用其资产链：footer chevron / 全部兜底语义色），在其上叠加「清风」设计体系：
#   现代蓝(#3b82f6) + 半透明 accent 选中态 + 12px 圆角窗 + 柔和投影 + 预编辑底部分隔线 +
#   淡色纯数字序号 + 半透明工具栏激活态 + 暗色深蓝灰面板 + 默认不显页码。
# 「清风·XX」主题继承本主题，仅覆盖 primary / accent_text / accent_soft 三色即整体换色。
#
# 设计意图：所有「清风」品牌外观集中在此层，_base 保持中性黑白以最小化对第三方主题的影响。
base = "_base"

[meta]
name = "清风设计基础"
version = "1.0"

[behavior]
always_show_pager = false
show_page_number = false   # 默认不显示页码数字（信息少但更整洁）

[colors]
primary = "#3b82f6"
# 中性色：亮色纯白 / 暗色深蓝灰（对齐设计稿暗色面板基调）。
bg = { light = "#FFFFFF", dark = "#121826" }
surface = { light = "#F2F4F8", dark = "#1E2A3E" }
border = { light = "#E2E5EB", dark = "#2E3650" }
text = { light = "#1A1D24", dark = "#F2F3F7" }
text_dim = { light = "#5A6072", dark = "#9AA3B4" }
text_hint = { light = "#9AA0AE", dark = "#5C6376" }
accent = "${primary}"
on_accent = "#FFFFFF"
# 选中候选 / 激活按钮：文字色 accent_text + 半透明底色 accent_soft。
# 派生主题覆盖这两色（+primary）即整体换色，其余引用处自动跟随。
accent_text = { light = "#2563eb", dark = "#60a5fa" }
accent_soft = { light = "#3b82f61A", dark = "#3b82f62E" }
# 菜单高亮文字色（深蓝）：配 accent_soft 高亮框使用。亮色取设计稿 700 阶 #1D4ED8，
# 暗色用亮蓝保证在深底高亮框上可读。
accent_menu = { light = "#1D4ED8", dark = "#60a5fa" }
shadow = { light = "#0000001F", dark = "#00000066" }
# 预编辑底部 / 工具栏分隔线（极淡）。
separator = { light = "#00000012", dark = "#FFFFFF14" }

selection = "${accent_soft}"
selection_text = "${accent_text}"
hover = { light = "#00000008", dark = "#FFFFFF12" }

menu_bg = "${bg}"
menu_border = { light = "#E2E5EB", dark = "${border}" }
menu_text = "${text}"
menu_disabled = { light = "#A8AEBC", dark = "#6B7180" }
# 菜单高亮：与候选选中一致的半透明 accent 框（#3b82f6@10%）+ 深 accent 文字（不刺眼、对比足）。
menu_hover_bg = "${accent_soft}"
menu_hover_text = "${accent_menu}"
menu_separator = { light = "#EBEDF2", dark = "${border}" }

tooltip_bg = { light = "#2A2F3EF5", dark = "#12151FF5" }
tooltip_text = { light = "#FFFFFF", dark = "${text}" }
status_bg = { light = "#2A2F3EF0", dark = "#12151FF0" }
status_text = { light = "#FFFFFF", dark = "${text}" }
status_border = "${accent}"
toast_bg = { light = "#2A2F3EF0", dark = "#12151FF0" }
toast_text = { light = "#FFFFFF", dark = "${text}" }

toolbar_background = { light = "#FFFFFFF7", dark = "#121826F7" }
toolbar_border = { light = "#E2E5EB", dark = "${border}" }
toolbar_grip = { light = "#B8BECC", dark = "#5A6072" }
toolbar_mode_chinese_bg = "${accent_soft}"
toolbar_mode_english_bg = { light = "#E8EAF0", dark = "#2E3650" }
toolbar_mode_text = "${accent_text}"
toolbar_full_width_off_bg = { light = "${surface}", dark = "${border}" }
toolbar_full_width_off_text = "${text_dim}"
toolbar_punct_english_bg = { light = "${surface}", dark = "${border}" }
toolbar_punct_english_text = "${text_dim}"
toolbar_settings_bg = { light = "${surface}", dark = "${border}" }
toolbar_settings_icon = "${text_dim}"
toolbar_settings_hole = { light = "${surface}", dark = "${border}" }
# 工具栏按钮鼠标悬停高亮（极淡：亮色 ~5% 黑 / 暗色 ~8% 白，对齐设计稿 status-btn:hover）。
toolbar_hover = { light = "#0000000D", dark = "#FFFFFF14" }

# 候选窗：12px 圆角 + 柔和投影；padding 提供候选/预编辑统一 inset。
[window]
padding = 5
radius = 12
border = { width = "1px", color = "${border}" }
background = "${bg}"
shadow = { offset = [0, 4], blur = 16, color = "${shadow}" }

# 预编辑行：透明底（与窗口同色），靠下方分隔线（引擎按 separator 色绘制）与候选区分。
# padding 左值即编码左缩进（candidate_top 独立条与 candidate_inline 内联模式都生效）。
[preedit_bar]
padding = [6, 8]
background = "transparent"
color = "${text_dim}"

[item]
padding = [7, 10]
radius = 8

[item.selected]
background = "${selection}"

[item.hover]
background = "${hover}"

# 序号：淡色纯数字（无圆圈），略小于候选字。
# padding 归零（覆盖 _base 的 left/right=3）+ 极小右间距：小数字周围不留多余空白，序号紧贴候选。
[index]
color = "${text_hint}"
shape = "none"
font_size = -6
padding = 0
margin = { right = 1 }

[text]
margin = { left = 3 }
# 普通候选文字用实色灰（文本渲染仅取 RGB、不支持 color alpha）：亮≈黑72%、暗≈白78% 预混合，
# 弱化非选中项，使选中候选的 accent 蓝相对更突出。
color = { light = "#4A4A4A", dark = "#C4C8D0" }

# 选中候选文字用 accent 色高亮（对齐设计稿）。
[text.selected]
color = "${accent_text}"

[comment]
margin = { left = 6 }
color = "${text_hint}"
font_size = -4

[footer_bar]
font_size = -4
margin = { left = 8 }
# 翻页箭头 / 页码用淡色（细小、不突兀，对齐设计稿小 ‹ ›）。
color = "${text_hint}"
# 覆盖 _base 的 chevron SVG（ref="" → 解析为空 → 回退到细小文字 ‹ › 符号）。
prev_image = { ref = "" }
next_image = { ref = "" }

[accent_bar]
background = "${accent}"

[status]
background = "${status_bg}"
color = "${status_text}"

[tooltip]
background = "${tooltip_bg}"
color = "${tooltip_text}"

[toast]
background = "${toast_bg}"
color = "${toast_text}"

[toolbar]
background = "${toolbar_background}"
border = { color = "${toolbar_border}" }

[toolbar.grip]
color = "${toolbar_grip}"

[toolbar.button]
background = "${toolbar_full_width_off_bg}"
color = "${toolbar_full_width_off_text}"

[toolbar.button.chinese]
background = "${toolbar_mode_chinese_bg}"

[toolbar.button.english]
background = "${toolbar_mode_english_bg}"

[toolbar.settings]
icon = "${toolbar_settings_icon}"
hole = "${toolbar_settings_hole}"

[menu.root]
radius = 8
background = "${menu_bg}"
border = { width = 1, color = "${menu_border}" }

[menu.item]
color = "${menu_text}"

[menu.item.hover]
background = "${menu_hover_bg}"
color = "${menu_hover_text}"

[menu.item.disabled]
color = "${menu_disabled}"

[menu.separator]
background = "${menu_separator}"
