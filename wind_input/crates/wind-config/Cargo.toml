[package]
name = "wind-config"
version.workspace = true
edition.workspace = true

[features]

[dependencies]
serde = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
dirs = { workspace = true }
# 快捷输入内置来源的 member id 常量（default_mix_modes / 存量迁移共用其单一真相源）
wind-quick-input = { path = "../wind-quick-input" }
# startup_trace 的时间戳需与主日志/TSF 日志格式一致，故与 service 同用 chrono
chrono = "0.4"
