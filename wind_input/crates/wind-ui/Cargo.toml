[package]
name = "wind-ui"
version.workspace = true
edition.workspace = true

[dependencies]
wind-theme = { path = "../wind-theme" }
wind-candidate = { path = "../wind-candidate" }
wind-bridge = { path = "../wind-bridge" }
tiny-skia = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
image = { workspace = true }
resvg = "0.44"
tokio = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }
# `#[implement]` 宏展开引用 `::windows_core`，需作为直接依赖（版本随 windows 0.58）。
windows-core = "0.58"
# host-render 协议常量（HOST_WINDOW_CANDIDATE）与 HostRenderHitRect。
wind-ipc = { path = "../wind-ipc" }

# macOS：CoreText 真字形文本后端（text/coretext.rs）；
# wind-ipc 供 manager_macos forwarder 编码 host-render / 候选命中 / 状态帧。
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.25"
core-text = "22.0.0"
wind-ipc = { path = "../wind-ipc" }
