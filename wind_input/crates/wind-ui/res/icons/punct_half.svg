<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- 半角（英文）标点 ., —— 与中文同位置，英文字形：句点为小实心点、逗号为带弧度的短斜钩。 -->
  <!-- . 句点：小实心点（位置同中文圈中心） -->
  <circle cx="7" cy="13" r="1.5" fill="#000"/>
  <!-- , 逗号：略带弧度的短斜钩（非直线、非圆头），更像英文 , 的尾。调弧度改控制点。 -->
  <path d="M15.7 11.5 Q16.0 13.6 13.7 16.0" fill="none" stroke="#000" stroke-width="1.6" stroke-linecap="round"/>
</svg>
