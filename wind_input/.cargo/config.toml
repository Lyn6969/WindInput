# 别名与验收标准/CI 同一份命令，防命令漂移（见 crates/wind-ui-types/AGENTS.md）。
[alias]
# headless 形态（Android/FFI 路径）在 host 上的编译门。
check-headless = "check -p wind-coordinator --no-default-features"
# Android target 编译门：wind-android 全包（闭包含 coordinator headless + uniffi/
# tracing-android 的 cfg 分支）。webdata 独立成 wind-webdata 后闭包为纯 Rust，
# **免 NDK 本机可跑**（rustup target add aarch64-linux-android 即可）；编不过且报
# 缺 C 编译器 = 有人把 -sys crate 混回了闭包，先查依赖别配 NDK。
check-android = "check -p wind-android --target aarch64-linux-android"
