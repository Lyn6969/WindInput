since = 2
enabled_when = "input.shift_temp_english.enabled == true"

[[items]]
key = "input.shift_temp_english.allow_symbols"
group = "input"
section = "临时英文与大小写"
type = "toggle"
label = "临时英文允许符号"
default = false
since = 2
enabled_when = "input.shift_temp_english.enabled == true"

[[items]]
key = "input.shift_temp_english.space_as_input"
group = "input"
