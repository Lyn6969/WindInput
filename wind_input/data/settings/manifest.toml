label = "模式指示样式"
hint = "进入临拼/双拼/快符/英文等模式时的标识"
default = "short"
since = 2
options = [
  { value = "short", label = "短称", description = "拼/双/快/英/符" },
  { value = "full", label = "全称" },
  { value = "none", label = "不显示" },
]

# 注：字体/颜色由主题（theme.yaml）控制，ui.font.* 当前未接入 UI，故不在此暴露——
# 待实装“候选窗字体覆盖”特性后再加回（family/path/render_mode）。

