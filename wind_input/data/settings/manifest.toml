# ═══════════════════════════ 外观 ═══════════════════════════
# ── 候选窗 ──
[[items]]
key = "ui.candidate.per_page"
group = "ui"
section = "候选窗"
type = "slider"
label = "每页候选数"
hint = "候选窗每页显示的候选项数量"
default = 7
min = 3
max = 9
step = 1
since = 1

[[items]]
key = "ui.candidate.layout"
group = "ui"
section = "候选窗"
type = "select"
label = "候选窗排列"
hint = "候选项横向或纵向排列"
default = "horizontal"
since = 2
options = [
  { value = "horizontal", label = "横排" },
  { value = "vertical", label = "竖排" },
]

[[items]]
key = "ui.candidate.preedit_display"
group = "ui"
section = "候选窗"
type = "select"
label = "编码显示方式"
hint = "编码（组合区）的显示位置"
default = "app_inline"
since = 2
options = [
  { value = "app_inline", label = "内嵌应用光标处", description = "候选窗不显示编码栏" },
  { value = "candidate_top", label = "候选窗顶部独立栏" },
  { value = "candidate_inline", label = "候选窗首单元内联" },
]

[[items]]
key = "ui.candidate.hide_window"
group = "ui"
section = "候选窗"
type = "toggle"
label = "隐藏候选窗"
hint = "盲打/自动上屏场景；隐藏后仍可输入"
default = false
since = 2

# ── 模式指示 ──
