# ── 特性可用性（模块 + 子特性两层；web 据此显示/隐藏/禁用）──
# 保留另一会话约定；随各命名空间深化(temp/freq/shadow/stats/phrase/theme)逐步开启。
[features.dict]
enabled = true
paged = true
import = false

[features.freq]
enabled = true

[features.phrase]
enabled = false

[features.stats]
enabled = false

[features.theme]
enabled = false
import_url = false
