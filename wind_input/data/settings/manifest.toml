# 统一声明式设置清单（core/setting/web 共用真相源）
# core 解析后注入 app/engine/variant，经 system.manifest 暴露为 JSON（items 原样透传）。
# 字段：key(点路径,对应 Config)/group/section/type/label/hint/default/since/options/min/max/step/unit/enabled_when
#
# 【对照来源】wind-config/src/config.rs（权威）。key 必须与真实配置点路径逐字一致。
# 【分组】group → Tab（方案/输入/快捷键/外观/常规/高级）；section → Tab 内子卡片。
#   前端按 (group, section) 聚合：同 section 的项渲染为一张卡片，section 首次出现序为卡片序。
# 【未进清单·待对话框承载】hotkeys 键位合成(目前以 string 暴露)、input.punct_custom.mappings、
#   input.auto_pair.*_pairs、schema.active/available（方案管理）、features.special_modes/mix_modes、
#   各 *.trigger_keys / *_keys 键组、compat.host_render_processes。
# 【待确认可选值】标 "# TODO opts" 的项：枚举字符串值未完全确认，暂用 string 承载，确认后改 select。

[meta]
version = 2                      # 清单格式版本（结构变更：2 组→6 Tab + section 子分组 + 真实全字段）

# ── 分组（→ web 页面/Tab、setting 导航）──
[[groups]]
key = "schema"
label = "方案"
order = 1

[[groups]]
key = "input"
label = "输入"
order = 2

[[groups]]
key = "hotkeys"
label = "快捷键"
order = 3

[[groups]]
key = "ui"
label = "外观"
order = 4

[[groups]]
key = "general"
label = "常规"
order = 5

[[groups]]
key = "advanced"
label = "高级"
order = 6

# ═══════════════════════════ 方案 ═══════════════════════════
[[items]]
key = "schema.primary_codetable"
group = "schema"
section = "默认方案"
type = "string" # TODO opts：应为方案下拉（动态来自 schema.list）
label = "主码表方案"
hint = "主力码表方案 id（如 wubi86）"
default = ""
since = 2

[[items]]
key = "schema.primary_pinyin"
group = "schema"
section = "默认方案"
type = "string" # TODO opts：应为方案下拉
label = "主拼音方案"
hint = "混输/临时拼音使用的拼音方案 id"
default = ""
since = 2

# ═══════════════════════════ 输入 ═══════════════════════════
# ── 标点与符号 ──
[[items]]
key = "input.auto_pair.chinese"
group = "input"
section = "标点与符号"
type = "toggle"
label = "中文标点自动配对"
hint = "输入左括号自动补右括号"
default = true
since = 2

[[items]]
key = "input.auto_pair.english"
group = "input"
section = "标点与符号"
type = "toggle"
label = "英文标点自动配对"
default = true
since = 2

[[items]]
key = "input.punct_follow_mode"
group = "input"
section = "标点与符号"
type = "toggle"
label = "标点跟随中英模式"
hint = "英文模式下自动用英文标点"
default = false
since = 2

[[items]]
key = "input.smart_punct_after_digit"
group = "input"
section = "标点与符号"
type = "toggle"
label = "数字后智能标点"
hint = "数字后输入 . , : 保持英文"
default = true
since = 1

[[items]]
key = "input.smart_punct_list"
group = "input"
section = "标点与符号"
type = "string"
label = "数字后保持英文的标点"
hint = "默认 .,:"
default = ".,:"
since = 2

[[items]]
key = "input.smart_symbol_mode"
group = "input"
section = "标点与符号"
type = "toggle"
label = "智能符号模式"
hint = "同一中文标点限时内连按两次，替换为英文"
default = false
since = 1

[[items]]
key = "input.smart_symbol_timeout_ms"
group = "input"
section = "标点与符号"
type = "slider"
label = "智能符号判定时限"
default = 500
min = 100
max = 2000
step = 50
unit = "ms"
since = 2
enabled_when = "input.smart_symbol_mode == true"

[[items]]
key = "input.smart_symbol_chars"
group = "input"
section = "标点与符号"
type = "string"
label = "智能符号字符集"
hint = "参与智能符号转换的中文标点集合"
default = "。，？！：；、～￥·……——"
since = 2
enabled_when = "input.smart_symbol_mode == true"

[[items]]
key = "input.punct_custom.enabled"
group = "input"
section = "标点与符号"
type = "toggle"
label = "启用自定义标点映射"
hint = "映射表在「标点映射」对话框中编辑"
default = false
since = 2

# ── 上屏控制 ──
[[items]]
key = "input.enter_behavior"
group = "input"
section = "上屏控制"
type = "string" # TODO opts：回车行为（commit/... 待确认）
label = "有编码时回车行为"
default = "commit"
since = 2

[[items]]
key = "input.space_on_empty_behavior"
group = "input"
section = "上屏控制"
type = "string" # TODO opts：空码空格行为
label = "空码时空格行为"
default = "commit"
since = 2

[[items]]
key = "input.code_commit.auto_commit_at_full"
group = "input"
section = "上屏控制"
type = "toggle"
label = "全码自动上屏"
hint = "唯一精确且无更长后继时直接上屏"
default = false
since = 2

[[items]]
key = "input.code_commit.auto_commit_block_on_pinyin"
group = "input"
section = "上屏控制"
type = "toggle"
label = "有拼音候选时否决全码上屏"
default = true
since = 2
enabled_when = "input.code_commit.auto_commit_at_full == true"

[[items]]
key = "input.code_commit.auto_commit_min_len"
group = "input"
section = "上屏控制"
type = "number"
label = "自动上屏最短码长"
hint = "0 跟随方案 max_code_length"
default = 0
min = 0
max = 10
since = 2
enabled_when = "input.code_commit.auto_commit_at_full == true"

[[items]]
key = "input.code_commit.top_code_commit"
group = "input"
section = "上屏控制"
type = "toggle"
label = "超长时取前 N 码顶字上屏"
default = false
since = 2

[[items]]
key = "input.code_commit.clear_on_empty_max"
group = "input"
section = "上屏控制"
type = "toggle"
label = "满码无候选时清空缓冲"
default = false
since = 2

# ── 临时英文与大小写 ──
[[items]]
key = "input.shift_temp_english.enabled"
group = "input"
section = "临时英文与大小写"
type = "toggle"
label = "Shift 临时英文"
default = true
since = 2

[[items]]
key = "input.shift_temp_english.show_english_candidates"
group = "input"
section = "临时英文与大小写"
type = "toggle"
label = "临时英文显示候选"
default = true
since = 2
enabled_when = "input.shift_temp_english.enabled == true"

[[items]]
key = "input.shift_temp_english.shift_behavior"
group = "input"
section = "临时英文与大小写"
