type = "toggle"
label = "切换模式时取消大写锁定"
default = false
since = 2

# ── 拼音与编码 ──
[[items]]
key = "input.filter_mode"
group = "input"
section = "拼音与编码"
type = "select"
label = "字符集过滤"
hint = "限制候选字符集范围"
default = "smart"
since = 1
options = [
  { value = "smart", label = "智能" },
  { value = "general", label = "通用" },
  { value = "gb18030", label = "GB18030" },
]

[[items]]
key = "input.pinyin_separator"
group = "input"
section = "拼音与编码"
type = "string" # TODO opts：拼音分隔（auto/...）
label = "拼音分隔符"
default = "auto"
since = 2

[[items]]
key = "input.numpad_behavior"
group = "input"
section = "拼音与编码"
type = "string" # TODO opts：小键盘行为枚举待确认
label = "小键盘行为"
default = ""
since = 2

# ── 短语 ──
[[items]]
key = "input.phrase.min_prefix_length"
group = "input"
section = "短语"
type = "number"
label = "短语前缀触发最小长度"
